[package]
name = "omaprot-engine"
version = "1.0.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Omarchy bleeding-edge Proton optimization engine, Steam compatibility tool provisioner, and CachyOS-style kernel/ISA build orchestrator"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
